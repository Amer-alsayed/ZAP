# Coturn STUN & TURN Relay Server Configuration for ZAP
listening-port=3478
tls-listening-port=5349
min-port=49160
max-port=49200

# Authentication (replace with strong credentials or use-auth-secret in production)
realm=zap.local
lt-cred-mech
# user=zapuser:<CHANGE_ME_STRONG_TURN_PASSWORD>

# Security & Fingerprinting
fingerprint
no-cli
no-tcp-relay
stale-nonce
no-multicast-peers
no-loopback-peers
