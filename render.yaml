services:
  - type: web
    name: zap-messenger
    region: frankfurt
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # Required for persistence: Paste your free Neon.tech PostgreSQL connection URI (postgresql://user:pass@host/neondb?sslmode=require)
