name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Security Invariants & Integration Test Suite
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install --prefix server
          npm install --prefix client --include=dev --legacy-peer-deps

      - name: Verify Cryptographic Security Invariants (10/10)
        run: npm run test:crypto

      - name: Verify Multi-Client E2E Integration Suite (20/20)
        run: npm run test:integration

      - name: Verify Client Production Build
        run: npm run build --prefix client
