name: CI / Security Invariant Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Node ${{ matrix.node-version }} - Crypto Tests & Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install --prefix server
          npm install --prefix client --include=dev --legacy-peer-deps

      - name: Run Cryptographic Invariant Verification
        run: npm run test:crypto

      - name: Build Client Production Bundle
        run: npm run build --prefix client

      - name: Server Configuration Validation
        run: node -e "import('./server/src/config.js').then(() => console.log('✓ Server config valid.'));"
