<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Chatra is a completely anonymous, secure, and end-to-end encrypted real-time chat application supporting text, calling, and file sharing." />
    <title>Chatra</title>
    <style>
      /* Immediate background reset to avoid flash */
      html, body {
        background-color: #000000 !important;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        position: fixed;
        left: 0;
        top: 0;
      }
      
      .app-preloader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle at 70% 30%, #0e0e0e 0%, #000000 100%);
        color: #cccccc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 99999;
      }
      
      .preloader-logo-container {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
      }
      
      .preloader-glow {
        position: absolute;
        width: 120px;
        height: 120px;
        background: rgba(0, 122, 204, 0.18);
        border-radius: 50%;
        filter: blur(40px);
        animation: preloaderPulseGlow 2.5s ease-in-out infinite alternate;
      }
      
      .preloader-logo {
        position: relative;
        width: 72px;
        height: 72px;
        animation: preloaderLogoBounce 2.2s cubic-bezier(0.25, 1, 0.5, 1) infinite alternate;
      }
      
      .preloader-bar-bg {
        width: 140px;
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 16px;
      }
      
      .preloader-bar {
        width: 40%;
        height: 100%;
        background: #007acc;
        border-radius: 2px;
        animation: preloaderLoadSlide 1.8s cubic-bezier(0.65, 0.05, 0.36, 1) infinite;
      }
      
      .preloader-text {
        font-size: 13px;
        font-weight: 500;
        color: #888888;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        animation: preloaderFadePulse 1.5s ease-in-out infinite alternate;
      }

      @keyframes preloaderPulseGlow {
        0% { transform: scale(0.9); opacity: 0.5; }
        100% { transform: scale(1.2); opacity: 1; }
      }
      
      @keyframes preloaderLogoBounce {
        0% { transform: translateY(3px); }
        100% { transform: translateY(-3px); }
      }
      
      @keyframes preloaderLoadSlide {
        0% { transform: translateX(-150%); }
        50% { transform: translateX(100%); }
        100% { transform: translateX(250%); }
      }
      
      @keyframes preloaderFadePulse {
        0% { opacity: 0.4; }
        100% { opacity: 0.85; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-preloader">
        <div class="preloader-logo-container">
          <div class="preloader-glow"></div>
          <svg class="preloader-logo" viewBox="0 0 24 24" fill="none" stroke="#007acc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            <path d="m9 11 2 2 4-4" stroke="#30d158" stroke-width="2"/>
          </svg>
        </div>
        <div class="preloader-bar-bg">
          <div class="preloader-bar"></div>
        </div>
        <div class="preloader-text">Initializing Secure Session...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
