<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="description"
    content="Chatra is a completely anonymous, secure, and end-to-end encrypted real-time chat application supporting text, calling, and file sharing." />
  <title>Chatra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent-rgb: 0, 122, 204;
      --accent-color: rgb(var(--accent-rgb));
    }
  </style>
  <script>
    try {
      var savedRgb = localStorage.getItem('chatra_theme_rgb');
      if (savedRgb) {
        document.documentElement.style.setProperty('--accent-rgb', savedRgb);
      }
    } catch (e) {}
  </script>
  <style>
    /* Immediate background reset to avoid flash*/
    html,
    body {
      background-color: #000000 !important;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      left: 0;
      top: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .app-preloader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #000000;
      color: #cccccc;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "SF Pro", "Inter", -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      z-index: 99999;
      transition: opacity 0.3s ease-out;
      will-change: opacity;
    }

    .app-preloader.fading-out {
      opacity: 0;
      pointer-events: none;
    }

    .preloader-logo-container {
      position: relative;
      width: 76px;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }

    .preloader-glow {
      position: absolute;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(var(--accent-rgb), 0.3) 0%, rgba(var(--accent-rgb), 0) 70%);
      animation: preloaderGlowPulse 2.4s ease-in-out infinite alternate;
    }

    .preloader-logo {
      position: relative;
      width: 56px;
      height: 56px;
      filter: drop-shadow(0 0 16px rgba(var(--accent-rgb), 0.45));
      z-index: 2;
      animation: preloaderLogoBreathe 2.4s ease-in-out infinite alternate;
    }

    .preloader-bar-bg {
      width: 140px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
      margin-bottom: 14px;
    }

    .preloader-bar {
      position: absolute;
      top: 0;
      left: -60px;
      width: 60px;
      height: 100%;
      background: linear-gradient(90deg, transparent 0%, var(--accent-color) 50%, transparent 100%);
      border-radius: 99px;
      animation: preloaderBeamSlide 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .preloader-text {
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      animation: preloaderTextPulse 2.4s ease-in-out infinite alternate;
    }

    @keyframes preloaderGlowPulse {
      0% {
        transform: scale(0.92);
        opacity: 0.35;
      }
      100% {
        transform: scale(1.15);
        opacity: 0.75;
      }
    }

    @keyframes preloaderLogoBreathe {
      0% {
        transform: scale(0.98);
        opacity: 0.92;
      }
      100% {
        transform: scale(1.02);
        opacity: 1;
      }
    }

    @keyframes preloaderBeamSlide {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(350%);
      }
    }

    @keyframes preloaderTextPulse {
      0% {
        opacity: 0.35;
      }
      100% {
        opacity: 0.75;
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="app-preloader">
      <div class="preloader-logo-container">
        <div class="preloader-glow"></div>
        <svg class="preloader-logo" viewBox="0 0 24 24" fill="none" stroke="var(--accent-color)" stroke-width="1.5"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          <path d="m9 11 2 2 4-4" stroke="var(--accent-color)" stroke-width="2" />
        </svg>
      </div>
      <div class="preloader-bar-bg">
        <div class="preloader-bar"></div>
      </div>
      <div class="preloader-text">Restoring secure session...</div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
